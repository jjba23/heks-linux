# ====== Heks-Linux Kitty configuration ======
# auto-generated file, DO NOT EDIT!

# --- General ---
allow_remote_control yes
listen_on unix:/tmp/kitty
shell_integration enabled
confirm_os_window_close 0
# --- Window Layout ---
window_padding_width 14
hide_window_decorations yes
background_opacity 0.9
background_blur 0
# --- Scrolling ---
scrollback_lines 100000
scrollback_pager less
# --- Font ---
font_family Intel One Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0
# --- Shell ---
shell bash
# --- Colors ---
foreground #e6e1cf
background #0f1419
map ctrl+y paste_from_clipboard
map alt+w copy_to_clipboard
map ctrl++ change_font_size all +2.0
map ctrl+shift++ change_font_size all +2.0
map ctrl+- change_font_size all -2.0
map ctrl+shift+- change_font_size all -2.0
map ctrl+v scroll_page_down
map alt+v scroll_page_up
map alt+s show_scrollback
map alt+r show_scrollback
map alt+< scroll_home
map alt+shift+< scroll_home
map alt+> scroll_end
map alt+shift+> scroll_end
