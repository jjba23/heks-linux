# Copyright © Josep Bigorra <jjbigorra@gmail.com>
#
# Two jobs, because a gate and a publication are two different questions.
# `gates' runs `maak ci': check that every Scheme file is the way the pinned
# formatter would write it, compile every module, run the suite, and build the
# API reference.  `deploy' runs `maak deploy' once the gates are green, which
# builds the reference again and copies it into the directory the server reads.
#
# Both run where the tree has landed -- a push to trunk, or a dispatch -- and
# `deploy' needs `gates', so a build published from a tree that failed its own
# checks is not possible: red gates mean no deploy at all.
#
# The deploy reaches the site because of where a Byggsteg task runs.  A job's
# tasks are run in the job's clone on the machine the daemon runs on -- a
# container only when the job names an image, and this one does not -- and that
# machine is the one serving jointhefreeworld.org, with /srv/http on it.  The
# copy `maak deploy' makes is therefore the publication, not a write into a
# container that is thrown away with the job.
#
# `maak test' wraps the suite in `guix shell --container', a Byggsteg job cannot
# create a second user namespace inside the one it runs in, and every pipeline
# run of this configuration failed in `call-with-container' before the first
# test ran because of it.  `maak ci' asks the same questions with the container
# left to the job, which is why the gates run that task and not `test'.

name: CI

on:
  push:
    branches: [trunk]
  # A pipeline can be asked for by hand, which is what a channel pin wants: it
  # changes nothing this job reads, and waiting for the next commit to find out
  # whether it still passes is a wait with no reason in it.
  workflow_dispatch:

permissions:
  contents: read

# One pipeline per branch.  A second push supersedes the first: the run that is
# already building a commit nobody is waiting for any more is a run to cancel,
# not a run to queue behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: 🧱 Gates
    uses: jjba23/byggsteg-github/.github/workflows/byggsteg.yml@trunk
    with:
      tasks: maak-ci
      # Bound the wait.  The bridge follows the deployment's job by polling it,
      # eight seconds apart, and gives up after 4096 polls -- most of a working
      # day.  Four hundred and fifty is an hour: longer than this configuration
      # takes to build from nothing, and short enough that a job that has hung
      # fails while somebody is still watching it.
      poll-limit: "450"
    secrets: inherit

  deploy:
    name: 🚀 Deploy
    needs: gates
    uses: jjba23/byggsteg-github/.github/workflows/byggsteg.yml@trunk
    with:
      tasks: maak-deploy
      poll-limit: "450"
    secrets: inherit
