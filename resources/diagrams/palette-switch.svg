<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="max-width: 308px; background-color: rgb(5, 8, 7);" viewBox="4 4 308 928" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#my-svg{font-family:JuliaMono,ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;fill:#d4ffe0;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#0b1a12;}#my-svg .error-text{fill:#f4e5ed;stroke:#f4e5ed;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#39ff88;stroke:#39ff88;}#my-svg .marker.cross{stroke:#39ff88;}#my-svg svg{font-family:JuliaMono,ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;}#my-svg p{margin:0;}#my-svg .label{font-family:JuliaMono,ui-monospace,SFMono-Regular,Menlo,monospace;color:#c8ffd6;}#my-svg .cluster-label text{fill:#8bffb0;}#my-svg .cluster-label span{color:#8bffb0;}#my-svg .cluster-label span p{background-color:transparent;}#my-svg .label text,#my-svg span{fill:#c8ffd6;color:#c8ffd6;}#my-svg .node rect,#my-svg .node circle,#my-svg .node ellipse,#my-svg .node polygon,#my-svg .node path{fill:#0a1710;stroke:#2f9e57;stroke-width:1px;}#my-svg .rough-node .label text,#my-svg .node .label text,#my-svg .image-shape .label,#my-svg .icon-shape .label{text-anchor:middle;}#my-svg .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#my-svg .rough-node .label,#my-svg .node .label,#my-svg .image-shape .label,#my-svg .icon-shape .label{text-align:center;}#my-svg .node.clickable{cursor:pointer;}#my-svg .root .anchor path{fill:#39ff88!important;stroke-width:0;stroke:#39ff88;}#my-svg .arrowheadPath{fill:#faf7f8;}#my-svg .edgePaths .path{stroke:#39ff88;stroke-width:1px;}#my-svg .flowchart-link{stroke:#39ff88;fill:none;}#my-svg .edgeLabel{background-color:#050807;text-align:center;}#my-svg .edgeLabel p{background-color:#050807;}#my-svg .edgeLabel rect{opacity:0.5;background-color:#050807;fill:#050807;}#my-svg .labelBkg{background-color:rgba(5, 8, 7, 0.5);}#my-svg .cluster rect{fill:#071009;stroke:#1f7a3d;stroke-width:1px;}#my-svg .cluster text{fill:#8bffb0;}#my-svg .cluster span{color:#8bffb0;}#my-svg .node .collapsed-indicator{fill:#1f7a3d;stroke:none;opacity:0.6;}#my-svg .node .collapsed-separator{stroke:#1f7a3d;stroke-width:0.75px;}#my-svg div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:JuliaMono,ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:#0b1a12;border:1px solid hsl(148, 0.5405405405%, 0%);border-radius:2px;pointer-events:none;z-index:100;}#my-svg .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#d4ffe0;}#my-svg rect.text{fill:none;stroke-width:0;}#my-svg .icon-shape,#my-svg .image-shape{background-color:#050807;text-align:center;}#my-svg .icon-shape p,#my-svg .image-shape p{background-color:#050807;padding:2px;}#my-svg .icon-shape .label rect,#my-svg .image-shape .label rect{opacity:0.5;background-color:#050807;fill:#050807;}#my-svg .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#my-svg .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#my-svg .node .neo-node{stroke:#2f9e57;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:#2f9e57;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:#2f9e57;stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#2f9e57;filter:none;}#my-svg [data-look="neo"].node circle{stroke:#2f9e57;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:#2f9e57;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#2f9e57;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g><marker id="my-svg_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-v2-pointEnd-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto"><path d="M 0 0 L 11.5 7 L 0 14 z" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_flowchart-v2-pointStart-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="1" refY="7" markerUnits="userSpaceOnUse" markerWidth="11.5" markerHeight="14" orient="auto"><polygon points="0,7 11.5,14 11.5,0" class="arrowMarkerPath" style="stroke-width: 0; 