 32 4; stroke-dashoffset: 0;;" data-edge="true" data-et="edge" data-id="L_dconf_rest_0" data-points="W3sieCI6MTU4LCJ5Ijo0Mzh9LHsieCI6MTU4LCJ5Ijo0Nzh9XQ==" data-look="neo" marker-end="url(#my-svg_flowchart-v2-pointEnd-margin)"/><path d="M158,607L158,643" id="my-svg-L_rest_reload_0" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style="stroke-dasharray: 0 0 32 4; stroke-dashoffset: 0;;" data-edge="true" data-et="edge" data-id="L_rest_reload_0" data-points="W3sieCI6MTU4LCJ5Ijo2MDd9LHsieCI6MTU4LCJ5Ijo2NDd9XQ==" data-look="neo" marker-end="url(#my-svg_flowchart-v2-pointEnd-margin)"/><path d="M158,797L158,833" id="my-svg-L_reload_desktop_0" class="edge-thickness-normal edge-pattern-solid edge-thickness-normal edge-pattern-solid flowchart-link" style="stroke-dasharray: 0 0 32 4; stroke-dashoffset: 0;;" data-edge="true" data-et="edge" data-id="L_reload_desktop_0" data-points="W3sieCI6MTU4LCJ5Ijo3OTd9LHsieCI6MTU4LCJ5Ijo4Mzd9XQ==" data-look="neo" marker-end="url(#my-svg_flowchart-v2-pointEnd-margin)"/></g><g class="edgeLabels"/><g class="nodes"><g class="node default" id="my-svg-flowchart-key-0" data-look="neo" transform="translate(158, 55.5)"><rect class="basic label-container" style="" x="-146" y="-43.5" width="292" height="87"/><g class="label" style="" transform="translate(-130, -31.5)"><rect/><foreignObject width="260" height="63"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p>Mod+Shift+C<br />or the palette glyph on the bar</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-symbol-1" data-look="neo" transform="translate(158, 172)"><rect class="basic label-container" style="" x="-91.6015625" y="-33" width="183.203125" height="66"/><g class="label" style="" transform="translate(-75.6015625, -21)"><rect/><foreignObject width="151.203125" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;"><span class="nodeLabel"><p>one palette symbol<br />heks-linux-palette</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-gtk-4" data-look="neo" transform="translate(158, 288.5)"><rect class="basic label-container" style="" x="-146" y="-43.5" width="292" height="87"/><g class="label" style="" transform="translate(-130, -31.5)"><rect/><foreignObject width="260" height="63"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p>1. the GTK pass<br />gtk-3.0, gtk-4.0, the dconf writer</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-dconf-6" data-look="neo" transform="translate(158, 405)"><rect class="basic label-container" style="" x="-95.8046875" y="-33" width="191.609375" height="66"/><g class="label" style="" transform="translate(-79.8046875, -21)"><rect/><foreignObject width="159.609375" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;"><span class="nodeLabel"><p>2. the dconf keys<br />icon theme, cursors</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-rest-8" data-look="neo" transform="translate(158, 542.5)"><rect class="basic label-container" style="" x="-146" y="-64.5" width="292" height="129"/><g class="label" style="" transform="translate(-130, -52.5)"><rect/><foreignObject width="260" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p>3. everything that reloads itself<br />niri, whelk, kitty, zen, btop,<br />lambdock, labwc, wallpaper, the emacs bridge</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-reload-10" data-look="neo" transform="translate(158, 722)"><rect class="basic label-container" style="" x="-146" y="-75" width="292" height="150"/><g class="label" style="" transform="translate(-130, -63)"><rect/><foreignObject width="260" height="126"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p>4. each surface reloads on its own file<br />whelk within a quarter of a second,<br />the dock's launchers about 150ms after</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-desktop-12" data-look="neo" transform="translate(158, 880.5)"><rect class="basic label-container" style="" x="-146" y="-43.5" width="292" height="87"/><g class="label" style="" transform="translate(-130, -31.5)"><rect/><foreignObject width="260" height="63"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p>the desktop repainted<br />the icons included, because GTK went first</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>