tion</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-kernel-4" data-look="neo" transform="translate(158, 341)"><rect class="basic label-container" style="" x="-146" y="-54" width="292" height="108"/><g class="label" style="" transform="translate(-130, -42)"><rect/><foreignObject width="260" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p>the kernel<br />rd.luks.uuid= names the container, root= the filesystem</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-initramfs-6" data-look="neo" transform="translate(158, 478.5)"><rect class="basic label-container" style="" x="-146" y="-43.5" width="292" height="87"/><g class="label" style="" transform="translate(-130, -31.5)"><rect/><foreignObject width="260" height="63"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p>the initramfs<br />dracut's crypt module asks for the passphrase once</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-luks-8" data-look="neo" transform="translate(158, 616)"><rect class="basic label-container" style="" x="-146" y="-54" width="292" height="108"/><g class="label" style="" transform="translate(-130, -42)"><rect/><foreignObject width="260" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p>the LUKS2 container, opened with that passphrase<br />Argon2id, and the cost follows the machine's memory</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-btrfs-10" data-look="neo" transform="translate(158, 753.5)"><rect class="basic label-container" style="" x="-146" y="-43.5" width="292" height="87"/><g class="label" style="" transform="translate(-130, -31.5)"><rect/><foreignObject width="260" height="63"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p>BTRFS inside it<br />root is mounted with rootflags=subvol=@</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-fstab-12" data-look="neo" transform="translate(158, 891)"><rect class="basic label-container" style="" x="-146" y="-54" width="292" height="108"/><g class="label" style="" transform="translate(-130, -42)"><rect/><foreignObject width="260" height="84"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 260px; text-align: center; width: 260px;"><span class="nodeLabel"><p>/etc/fstab mounts @home and /.snapshots<br />from the UUIDs the install found</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-greeter-14" data-look="neo" transform="translate(158, 1007.5)"><rect class="basic label-container" style="" x="-79" y="-22.5" width="158" height="45"/><g class="label" style="" transform="translate(-63, -10.5)"><rect/><foreignObject width="126" height="21"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 260px; text-align: center;"><span class="nodeLabel"><p>greetd, on tty1</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-session-16" data-look="neo" transform="translate(158, 1103)"><rect class="basic label-container" style="" x="-76" y="-33" width="152" height="66"/><g class="label" style="" transform="translate(-60, -21)"><rect/><foreignObject width="120" height="42"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: nowrap; line-height: